name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (offline/lexicon path only -- no transformers, no torch)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test (offline; the FinBERT model is never downloaded)
        # No Alpaca credentials and no model cache are provided: the suite runs entirely on
        # the bundled synthetic fixtures and mocks the FinBERT wrapper.
        run: pytest -q
